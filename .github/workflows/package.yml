name: Package

# Build check only: builds the sdist and wheel, checks them with twine and
# runs the test suite against the installed distributions. Nothing is
# published from here; releases are uploaded to PyPI manually.

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    name: Build distributions
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install build tools
      run: python -m pip install -U pip build twine
    - name: Build sdist and wheel
      run: python -m build
    - name: Check distributions
      run: python -m twine check --strict dist/*
    - name: Store built distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/*

  test:
    runs-on: ubuntu-latest
    name: Test ${{ matrix.dist }} distribution
    needs: build
    strategy:
      fail-fast: false
      matrix:
        dist:
          - sdist
          - wheel
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Download built distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Install ${{ matrix.dist }} distribution
      run: |
        if [ "${{ matrix.dist }}" = sdist ]; then
          python -m pip install dist/fitzyracing_fs-*.tar.gz
        else
          python -m pip install dist/fitzyracing_fs-*.whl
        fi
    - name: Remove source code
      run: rm -rvd fs
    - name: Install test requirements
      run: python -m pip install -r tests/requirements.txt pytest
    - name: Test installed package
      run: python -m pytest tests
